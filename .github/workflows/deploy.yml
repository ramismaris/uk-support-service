name: Deploy

# Pushes to main only run the checks. The server is updated by a manual run on main
# (Actions → Deploy → Run workflow) or at once by a demo-* tag.
on:
  push:
    branches: [main]
    tags: ["demo-*"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cp .env.template .env
      - run: scripts/check.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/check.sh

  deploy:
    needs: [backend, frontend]
    # Only main or a demo tag reaches the server: a manual run on a feature branch just runs the checks.
    if: >-
      startsWith(github.ref, 'refs/tags/demo-') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # One deploy at a time, on this job only: check-only runs of main must not queue behind it.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Update the server
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/uk-support-service' }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" bash -s -- "$DEPLOY_PATH" "$SHA" <<'EOF'
          set -euo pipefail
          cd "$1"
          git fetch --tags --force origin
          git checkout --detach "$2"
          cd deploy
          # The server may only have the legacy docker-compose v1.
          if docker compose version > /dev/null 2>&1; then compose="docker compose"; else compose="docker-compose"; fi
          # Build while the old containers still serve.
          $compose build
          # Replace only the app containers: db and caddy keep running, and caddy holds requests
          # (lb_try_duration in the Caddyfile) until the new ones answer, so users get no 502.
          # Removing instead of recreating also avoids docker-compose v1's
          # KeyError: 'ContainerConfig' on newer engines.
          $compose rm -sf api web
          $compose up -d --remove-orphans
          # The Caddyfile is a bind mount: apply its changes without restarting caddy.
          $compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          # v1 has no --wait: poll the API until it answers.
          for _ in $(seq 60); do
            if $compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" 2> /dev/null; then
              docker image prune -f
              exit 0
            fi
            sleep 5
          done
          echo "api did not become healthy"
          $compose logs --tail 50 api
          exit 1
          EOF
